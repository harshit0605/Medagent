# Pre-commit hooks — install with: pre-commit install
#
# Catches: secrets being committed, formatting/lint drift, accidental large
# files, broken merge artefacts. Run manually across the repo with:
#   pre-commit run --all-files
#
# The CI workflow (.github/workflows/ci.yml) runs ruff independently, but
# having it pre-commit keeps fast feedback local.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secret scanner — blocks .env, credentials, tokens, API keys.
  # Config in .gitleaks.toml (allowlist for known false-positives like
  # example.com, docs sample keys).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type-check the curated core modules (the [tool.mypy] files list).
  # Runs the locally-installed mypy so it shares the project venv + config.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (core modules)
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
