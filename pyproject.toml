[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "medagent"
version = "0.1.0"
description = "WhatsApp-first care concierge agent monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "greenlet>=3.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "langgraph>=1.1.10",
  "langgraph-checkpoint-postgres>=3.0.5",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.5.0",
]
# Local, on-host voice-note transcription (WhatsApp voice notes → text).
# Optional so CPU/disk-heavy model weights aren't pulled in deployments
# that don't accept voice input; the transcription adapter degrades to a
# "please type" fallback when this isn't installed.
voice = [
  "faster-whisper>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
