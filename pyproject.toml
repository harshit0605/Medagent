[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "medagent"
version = "0.1.0"
description = "WhatsApp-first care concierge agent monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "greenlet>=3.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "langgraph>=1.1.10",
  "langgraph-checkpoint-postgres>=3.0.5",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "ruff>=0.5.0",
  "mypy>=1.11",
]
# Local, on-host voice-note transcription (WhatsApp voice notes → text).
# Optional so CPU/disk-heavy model weights aren't pulled in deployments
# that don't accept voice input; the transcription adapter degrades to a
# "please type" fallback when this isn't installed.
voice = [
  "faster-whisper>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "serial: touches global DB state (full-table sweeps over the shared remote DB). Auto-pinned to one xdist worker via the conftest hook so parallel runs don't cross-contaminate sweep counts. Run the suite parallel with: pytest -n auto --dist loadgroup",
]

[tool.ruff]
line-length = 100

# Gradual typing. The codebase predates mypy, so a repo-wide strict run would
# emit thousands of legacy errors and never go green. Instead we type-check a
# curated set of security/reliability PRIMITIVES strictly (the ``files`` list)
# and keep the door open to expand it module-by-module. CI runs
# ``mypy`` (no args) which picks up exactly this ``files`` list.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = [
  "app/circuit_breaker.py",
  "app/health.py",
  "app/operator_signature.py",
  "app/logging_redact.py",
  "app/security/crypto.py",
  "app/db/repositories/erasure_requests.py",
  "app/db/repositories/operator_actions.py",
]
